  <body class="play">
    <div class="sky" aria-hidden="true"></div>

    <div class="whisper" aria-hidden="true">
      <span>{{whisper_1}}</span>
      <span>{{whisper_2}}</span>
    </div>

    <main class="stage">
      <h1><span class="vh">RETRACE</span><img class="wordmark" src="{{root}}assets/wordmark.svg" width="408" height="61" alt="" /></h1>
      <p class="tagline">{{tagline}}</p>

      <div class="scene" aria-hidden="true">
        <svg viewBox="0 236 390 404" preserveAspectRatio="xMidYMid meet">
          <defs>
            <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".85" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient>
            <mask id="laid" maskUnits="userSpaceOnUse" x="-20" y="200" width="430" height="520">
              <path class="lay" d="" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" />
            </mask>
          </defs>
          <ellipse class="door-glow" cx="195" cy="336" rx="190" ry="100" fill="url(#glow)" opacity=".65" />
          <path class="door" d="M125 406V300A70 52 0 0 1 265 300V406Z" style="fill: var(--door)" />
          <rect class="horizon" x="70" y="406" width="250" height="1.4" fill="#fff" opacity=".85" />
          <path class="loop" d="M-6 700C64 640 164 630 144 550C130 494 60 494 68 550C78 604 166 590 206 500L214 470" fill="none" stroke="#fff" stroke-width="2.6" stroke-dasharray="7 7" stroke-linecap="round" opacity=".95" mask="url(#laid)" />
          <g class="plane" transform="translate(214 470) rotate(16) scale(2.592)">
            <path d="M0-17 13 12 1.7 8.6 0 14-1.7 8.6-13 12Z" fill="#d23f2e" />
            <path d="M0-17 1.7 8.6 0 14-1.7 8.6Z" fill="#8a2318" />
            <path d="M0-17-7.6 10.2M0-17 7.6 10.2" stroke="#fff" stroke-width=".8" opacity=".55" stroke-linecap="round" />
          </g>
        </svg>
      </div>

      <p class="line">{{subhero}}</p>

      <a class="store" id="get" href="#" aria-label="{{store_label}}" data-app-store="{{app_store_url}}">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.7c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.77-3.32-1.8-1.41-.14-2.76.83-3.47.83-.72 0-1.82-.81-2.99-.79-1.54.02-2.96.9-3.75 2.27-1.6 2.78-.41 6.89 1.15 9.14.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.78.74 2.99.72 1.24-.02 2.02-1.12 2.77-2.23.88-1.28 1.24-2.52 1.26-2.59-.03-.01-2.41-.93-2.43-3.65ZM14.1 5.95c.63-.77 1.06-1.83.94-2.9-.91.04-2.02.61-2.67 1.37-.58.67-1.1 1.76-.96 2.8 1.02.08 2.06-.52 2.69-1.27Z" /></svg>
        <span><small>{{store_small}}</small><strong>{{store_strong}}</strong></span>
      </a>
      <p class="meta" data-meta data-soon="{{meta_soon}}">{{meta_live}}</p>
      <p class="about">{{about}}</p>
    </main>

    <svg class="echo" viewBox="-17 -17 34 34" aria-hidden="true">
      <path d="M0-14 10.5 10 1.4 7.1 0 11.5-1.4 7.1-10.5 10Z" fill="#fff" />
      <path d="M0-14 1.4 7.1 0 11.5-1.4 7.1Z" style="fill: var(--door)" />
    </svg>

    <button class="skip" type="button">{{skip}}</button>

    <nav class="langs" aria-label="{{languages_label}}">
        {{languages_html}}
    </nav>
{{partial:footer}}

    <script>
      (() => {
        const body = document.body;
        const store = document.querySelector("[data-app-store]");
        const APP_STORE_URL = store.dataset.appStore;
        if (APP_STORE_URL) store.href = APP_STORE_URL;
        else {
          store.removeAttribute("href");
          store.setAttribute("aria-disabled", "true");
          const meta = document.querySelector("[data-meta]");
          meta.textContent = meta.dataset.soon;
        }

        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let seen = false;
        try { seen = sessionStorage.getItem("retrace.seen") === "1"; sessionStorage.setItem("retrace.seen", "1"); } catch {}

        // The plane flies in once along its loop, laying its dashes, and holds still (the game's home).
        const loop = document.querySelector(".scene .loop");
        const lay = document.querySelector(".scene .lay");
        const plane = document.querySelector(".scene .plane");
        lay.setAttribute("d", loop.getAttribute("d"));
        const L = loop.getTotalLength();
        lay.style.strokeDasharray = L;
        const pose = (s) => {
          const p = loop.getPointAtLength(s), q = loop.getPointAtLength(Math.min(L, s + 1));
          const a = s >= L ? 16 : (Math.atan2(q.y - p.y, q.x - p.x) * 180) / Math.PI + 90;
          plane.setAttribute("transform", `translate(${p.x} ${p.y}) rotate(${a}) scale(2.592)`);
          lay.style.strokeDashoffset = L - s;
        };
        let flying = 0;
        const settle = () => { cancelAnimationFrame(flying); flying = 0; pose(L); };
        const fly = (delay) => {
          pose(0);
          const t0 = performance.now() + delay;
          const step = (now) => {
            const k = Math.min(1, Math.max(0, (now - t0) / 2000));
            pose(L * (1 - Math.pow(1 - k, 3)));
            flying = k < 1 ? requestAnimationFrame(step) : 0;
          };
          flying = requestAnimationFrame(step);
        };

        const land = () => { body.classList.remove("play"); body.classList.add("ready"); settle(); };
        if (seen || reduced) land();
        else fly(4400);
        document.querySelector(".skip").addEventListener("click", land);
        addEventListener("keydown", (e) => { if (e.key === "Escape" || e.key === "Enter" || e.key === " ") land(); }, { once: true });
        if (reduced || !matchMedia("(pointer: fine)").matches) return;

        // Your echo: the pointer's own path, played back a moment late.
        const echo = document.querySelector(".echo");
        const DELAY = 700;
        const path = [];
        let awake = seen, angle = 0;
        setTimeout(() => (awake = true), 4400);
        addEventListener("pointermove", (e) => path.push({ t: performance.now(), x: e.clientX, y: e.clientY }), { passive: true });
        (function tick() {
          requestAnimationFrame(tick);
          const now = performance.now() - DELAY;
          while (path.length > 2 && path[1].t <= now) path.shift();
          if (!awake || !path.length || path[0].t > now) return;
          const [a, b] = path;
          if (b && Math.hypot(b.x - a.x, b.y - a.y) > 2) angle = (Math.atan2(b.y - a.y, b.x - a.x) * 180) / Math.PI + 90;
          echo.classList.add("on");
          echo.style.transform = `translate(${a.x}px, ${a.y}px) rotate(${angle}deg)`;
        })();
      })();
    </script>
  </body>
</html>
