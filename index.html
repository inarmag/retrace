<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RETRACE — Outrun your past</title>
    <meta name="description" content="RETRACE, a one-thumb arcade game for iPhone. Every round you clear comes back to haunt you. Free on the App Store" />
    <link rel="canonical" href="https://inarmag.github.io/retrace/" />
    <meta name="theme-color" content="#0b0820" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RETRACE" />
    <meta property="og:title" content="RETRACE — Outrun your past" />
    <meta property="og:description" content="Every round you clear comes back to haunt you" />
    <meta property="og:url" content="https://inarmag.github.io/retrace/" />
    <meta property="og:image" content="https://inarmag.github.io/retrace/assets/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://inarmag.github.io/retrace/assets/og.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="assets/ember-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/ember-192.png" />
    <link rel="apple-touch-icon" href="assets/ember-touch.png" />
    <link rel="manifest" href="site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Unbounded:wght@700;800&display=swap" />
    <link rel="stylesheet" href="styles.css" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["VideoGame", "MobileApplication"],
        "name": "RETRACE",
        "url": "https://inarmag.github.io/retrace/",
        "image": "https://inarmag.github.io/retrace/assets/ember-512.png",
        "description": "A one-thumb arcade game. Every round you clear comes back to haunt you",
        "genre": ["Arcade", "Casual"],
        "gamePlatform": "iPhone",
        "operatingSystem": "iOS",
        "applicationCategory": "GameApplication",
        "inLanguage": ["en", "fr", "de", "es", "it", "pt-BR"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body class="play">
    <div class="sky" aria-hidden="true"></div>

    <div class="whisper" aria-hidden="true">
      <span>every move you make is remembered</span>
      <span>and it's coming back for you</span>
    </div>

    <main class="stage">
      <div class="beam" aria-hidden="true"></div>
      <div class="gate" aria-hidden="true"></div>

      <div class="cast" aria-hidden="true">
        <div class="echo">
          <svg viewBox="0 0 72 72"><path d="M22 38q5 5 10 0M40 38q5 5 10 0" fill="none" stroke="#073246" stroke-width="3.2" stroke-linecap="round" /></svg>
        </div>
        <div class="ember"><div class="eyes"><i></i><i></i></div></div>
      </div>

      <h1><img class="wordmark" src="assets/wordmark.svg" width="406" height="74" alt="RETRACE" /></h1>
      <p class="tagline">Outrun your past</p>
      <p class="line">Every round you clear comes back to haunt you</p>

      <a class="store" id="get" href="#" data-app-store>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.7c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.77-3.32-1.8-1.41-.14-2.76.83-3.47.83-.72 0-1.82-.81-2.99-.79-1.54.02-2.96.9-3.75 2.27-1.6 2.78-.41 6.89 1.15 9.14.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.78.74 2.99.72 1.24-.02 2.02-1.12 2.77-2.23.88-1.28 1.24-2.52 1.26-2.59-.03-.01-2.41-.93-2.43-3.65ZM14.1 5.95c.63-.77 1.06-1.83.94-2.9-.91.04-2.02.61-2.67 1.37-.58.67-1.1 1.76-.96 2.8 1.02.08 2.06-.52 2.69-1.27Z" /></svg>
        <span><small>Download on the</small><strong>App Store</strong></span>
      </a>
      <p class="meta" data-meta>Free · iPhone</p>
    </main>

    <div class="stalker" aria-hidden="true">
      <svg viewBox="0 0 34 34"><path d="M10 18q2.5 2.5 5 0M19 18q2.5 2.5 5 0" fill="none" stroke="#073246" stroke-width="2" stroke-linecap="round" /></svg>
    </div>

    <button class="skip" type="button">Skip</button>

    <footer class="foot">
      <span>RETRACE · © 2026 velvet.osiris</span>
      <nav aria-label="legal">
        <a href="support/">Support</a>
        <a href="privacy/">Privacy</a>
        <a href="licenses/">Licences</a>
      </nav>
    </footer>

    <script>
      (() => {
        const APP_STORE_URL = "";

        const body = document.body;
        const store = document.querySelector("[data-app-store]");
        if (APP_STORE_URL) store.href = APP_STORE_URL;
        else {
          store.removeAttribute("href");
          store.setAttribute("aria-disabled", "true");
          document.querySelector("[data-meta]").textContent = "Coming soon · Free · iPhone";
        }

        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let seen = false;
        try { seen = sessionStorage.getItem("retrace.seen") === "1"; sessionStorage.setItem("retrace.seen", "1"); } catch {}
        const land = () => { body.classList.remove("play"); body.classList.add("ready"); };
        if (seen || reduced) land();
        document.querySelector(".skip").addEventListener("click", land);
        addEventListener("keydown", (e) => { if (e.key === "Escape" || e.key === "Enter" || e.key === " ") land(); }, { once: true });

        const sky = document.querySelector(".sky");
        for (let i = 0; i < 40; i++) {
          const s = document.createElement("i");
          s.style.left = Math.random() * 100 + "%";
          s.style.top = Math.random() * 100 + "%";
          s.style.animationDelay = Math.random() * 4 + "s";
          sky.appendChild(s);
        }
        if (reduced) return;

        const eyes = document.querySelector(".ember .eyes");
        const ember = document.querySelector(".ember");
        const stalker = document.querySelector(".stalker");
        const DELAY = 120;
        const path = [];
        let awake = seen;
        setTimeout(() => (awake = true), 4800);

        addEventListener("pointermove", (e) => {
          path.push({ t: performance.now(), x: e.clientX, y: e.clientY });
          const r = ember.getBoundingClientRect();
          const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
          const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 300);
          eyes.style.transform = `translate(${(dx / d) * 10 * k}px, ${(dy / d) * 8 * k}px)`;
        }, { passive: true });

        (function tick() {
          requestAnimationFrame(tick);
          const now = performance.now() - DELAY;
          while (path.length > 1 && path[1].t <= now) path.shift();
          if (!awake || !path.length || path[0].t > now) return;
          stalker.classList.add("on");
          stalker.style.transform = `translate(${path[0].x}px, ${path[0].y}px)`;
        })();
      })();
    </script>
  </body>
</html>
